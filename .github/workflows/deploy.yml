name: Deploy to Server

on:
    push:
        branches:
            - staging

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Deploy on server
              env:
                  SERVER_IP: ${{ secrets.SERVER_IP }}
                  USERNAME: ${{ secrets.USERNAME }}
              run: |
                  ssh -o StrictHostKeyChecking=no "$USERNAME@$SERVER_IP" bash -s <<'EOF'
                  set -eo pipefail
                  cd /srv/web/babel-revolution

                  # .env.prod and docker-compose.yml are tracked in git but intentionally
                  # modified on the host (real secrets / compose overrides). Preserve them
                  # across the reset so a deploy never ships the committed placeholder env.
                  ts=$(date +%Y%m%d-%H%M%S)
                  mkdir -p /home/ubuntu/backups
                  cp -a .env.prod "/home/ubuntu/backups/.env.prod.$ts"
                  cp -a docker-compose.yml "/home/ubuntu/backups/docker-compose.yml.$ts"
                  cp -a .env.prod /tmp/.env.prod.keep
                  cp -a docker-compose.yml /tmp/docker-compose.yml.keep

                  git fetch origin staging
                  git checkout staging
                  git reset --hard origin/staging

                  cp -a /tmp/.env.prod.keep .env.prod
                  cp -a /tmp/docker-compose.yml.keep docker-compose.yml

                  docker-compose up -d --build
                  EOF
